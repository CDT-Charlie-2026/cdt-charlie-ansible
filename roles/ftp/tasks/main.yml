---
# FTP Deployment
# Name: Ryan Tagen
# Email: rst4035@rit.edu
# Date: 09-11-2026

# Install vsftpd
- name: Install vsftpd
  ansible.builtin.apt:
    name: "{{ ftp_package }}"
    state: present
    update_cache: true

# Feature 1: FTP User Access Control

# 1A: Create a dedicated group for FTP users
- name: Create FTP group
  ansible.builtin.group:
    name: "{{ ftp_group }}"
    state: present

# Reuse local packet accounts without changing their shells or home directories.
- name: Add packet users to the FTP group
  ansible.builtin.user:
    name: "{{ item.name }}"
    groups: "{{ ftp_group }}"
    append: true
    state: present
  loop: "{{ competition_users }}"

# Feature 2: FTP Directory Access Control

# 2A: Create the FTP home directory
- name: Create FTP home directory
  ansible.builtin.file:
    path: "{{ ftp_home }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

# 2B: Create a restricted upload directory
- name: Create FTP upload directory
  ansible.builtin.file:
    path: "{{ ftp_home }}/upload"
    state: directory
    owner: root
    group: "{{ ftp_group }}"
    mode: '2770'

- name: Restrict FTP authentication to packet users
  ansible.builtin.copy:
    dest: /etc/vsftpd.packet-users
    content: "{{ (competition_users | map(attribute='name') | list | join('\n')) + '\n' }}"
    owner: root
    group: root
    mode: '0644'

  notify: Restart FTP

# Feature 3: FTP Security Configuration

# 3A and 3B: Deploy secure vsftpd configuration
- name: Configure vsftpd security settings
  ansible.builtin.template:
    src: vsftpd.conf.j2
    dest: "{{ ftp_config }}"
    owner: root
    group: root
    mode: '0644'

  notify: Restart FTP

# Start and enable the FTP service
- name: Start and enable FTP service
  ansible.builtin.service:
    name: "{{ ftp_service }}"
    state: started
    enabled: true

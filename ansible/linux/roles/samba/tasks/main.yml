# Feature 3: Create smbusers group, add packet users to it, and set their Samba passwords
# Linux accounts must already exist or smbpasswd -a will fail
- name: Ensure smbusers group exists
  ansible.builtin.group:
    name: "smbusers"
    state: present

- name: Add packet users to smbusers group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: "smbusers"
    append: true   #append, don't replace existing group memberships
  loop:
    - charliebrown
    - lucyvanpelt
    - linusvanpelt
    - peppermintpatty
    - marcie
    - snoopy
    - woodstock
    - sallybrown
    - schroeder
    - pigpen
    - grayteam
    - othergrayteam
    - violetgray

- name: Set Samba password for packet users
  ansible.builtin.shell: |
    printf '%s\n%s\n' 'GoodGrief123!' 'GoodGrief123!' | smbpasswd -a -s {{ item }}
  loop:
    - charliebrown
    - lucyvanpelt
    - linusvanpelt
    - peppermintpatty
    - marcie
    - snoopy
    - woodstock
    - sallybrown
    - schroeder
    - pigpen
  no_log: true   # prevents passwords from appearing in Ansible output/logs

- name: Set Samba password for Gray Team users
  ansible.builtin.shell: |
    printf '%s\n%s\n' 'GreatPumpkin321!' 'GreatPumpkin321!' | smbpasswd -a -s {{ item }}
  loop:
    - grayteam
    - othergrayteam
    - violetgray
  no_log: true   # prevents passwords from appearing in Ansible output/logs
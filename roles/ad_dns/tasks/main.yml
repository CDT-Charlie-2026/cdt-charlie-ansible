---
- name: Install Active Directory Domain Services and DNS
  ansible.windows.win_feature:
    name:
      - AD-Domain-Services
      - DNS
    state: present
    include_management_tools: true
  register: ad_features
- name: Reboot if AD DS feature installation requires it
  ansible.windows.win_reboot: null
  when: ad_features.reboot_required
- name: Create or ensure team0Xpeanuts.local forest exists
  microsoft.ad.domain:
    dns_domain_name: "{{ domain_name }}"
    domain_netbios_name: "{{ netbios_name }}"
    safe_mode_password: '{{ ad_safe_mode_password }}' # From the vault
    reboot: true

- name: Set domain controller's DNS client to itself
  ansible.windows.win_dns_client:
    adapter_names: '*'
    dns_servers:
      - '{{ ansible_host }}'
        
- name: Create AD-integrated LAN and cloud reverse DNS zones
  ansible.windows.win_dns_zone:
    name: "{{ item }}"
    type: primary
    replication: forest
    state: present

  loop: "{{ ad_reverse_lookup_zones }}"

- name: Provision domain users and groups
  ansible.builtin.import_tasks: users.yml
  tags: [users]

---
- name: Disable automatic Windows Updates
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU
    name: NoAutoUpdate
    data: 1
    type: dword

- name: Stop and disable Windows Update service
  ansible.windows.win_service:
    name: wuauserv
    state: stopped
    start_mode: disabled

- name: Remove Sysprep unattend.xml
  ansible.windows.win_file:
    path: C:\unattend.xml
    state: absent

- name: Remove Sysprep unattend.xml
  ansible.windows.win_file:
    path: C:\Windows\System32\Sysprep\unattend.xml
    state: absent

- name: Uninstall Defender
  ansible.windows.win_feature:
    name: Windows-Defender
    state: absent
  register: defender_result

- name: Restart after uninstalling Defender
  ansible.windows.win_reboot:
    reboot_timeout: 600
  when: defender_result.reboot_required

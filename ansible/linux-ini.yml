# CDT Peanuts - Linux inventory (Ubuntu 24.04 LTS hosts only)
# Usage: ansible -i inventory.yml linux -m ping
# Requires sshpass on the control node for password auth.

all:
  vars:
    ansible_user: grayteam
    ansible_password: "GreatPumpkin321!"
    ansible_become: true
    ansible_become_method: sudo
    ansible_become_password: "GreatPumpkin321!"
    ansible_python_interpreter: auto_silent
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"


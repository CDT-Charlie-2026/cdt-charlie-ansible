---
- name: Install Active Directory Domain Services and DNS
  ansible.windows.win_feature:
    name:
      - AD-Domain-Services
      - DNS
    state: present
    include_management_tools: true
  register: ad_features
- name: Reboot if AD DS feature installation requires it
  ansible.windows.win_reboot: null
  when: ad_features.reboot_required
- name: Create or ensure peanuts.local forest exists
  microsoft.ad.domain:
    dns_domain_name: peanuts.local
    domain_netbios_name: PEANUTS
    safe_mode_password: '{{ ad_safe_mode_password }}' # From the vault
    reboot: true
  no_log: true
- name: Set domain controller's DNS client to itself
  ansible.windows.win_dns_client:
    adapter_names: '*'
    dns_servers:
      - '{{ ansible_host }}'
- name: Create AD-integrated reverse DNS zone
  ansible.windows.win_dns_zone:
    name: '{{ lan_octet }}.0.10.in-addr.arpa'
    type: primary
    replication: forest
    state: present

- name: Create all 10 domain users
    microsoft.ad.user:
      identity: "{{ item }}"
      sam_account_name: "{{ item }}"
      upn: "{{ item }}@{{ domain_name }}"
      password: "{{ user_password }}"
      update_password: on_create
      enabled: true
      state: present
    loop: "{{ admin_users + normal_users }}"
    no_log: true

- name: Add admins to Domain Admins
  microsoft.ad.group:
    identity: Domain Admins
    scope: global
    members:
      add: "{{ admin_users }}"
    state: present

- name: Remove normal users from Admins
  microsoft.ad.group:
    identity: Domain Admins
    scope: global
    members:
      remove: "{{ normal_users }}"
    state:present

---
# Debian/Ubuntu deployment. Requires community.mysql collection on controller.
- name: Install MySQL and Python connector
  ansible.builtin.apt:
    name:
      - "{{ mysql_package }}"
      - python3-pymysql
    state: present
    update_cache: true

- name: Start MySQL service
  ansible.builtin.service:
    name: "{{ mysql_service }}"
    state: started
    enabled: true

- name: Create competition database
  community.mysql.mysql_db:
    name: "{{ mysql_database }}"
    state: present
    login_unix_socket: /var/run/mysqld/mysqld.sock

- name: Create low-privilege MySQL user
  community.mysql.mysql_user:
    name: "{{ mysql_low_user }}"
    password: "{{ mysql_low_password }}"
    priv: "{{ mysql_database }}.*:SELECT"
    state: present
    login_unix_socket: /var/run/mysqld/mysqld.sock

- name: Create higher-privilege MySQL user
  community.mysql.mysql_user:
    name: "{{ mysql_high_user }}"
    password: "{{ mysql_high_password }}"
    priv: "{{ mysql_database }}.*:SELECT,INSERT,UPDATE,DELETE"
    state: present
    login_unix_socket: /var/run/mysqld/mysqld.sock

---
# Map inventory names to their teams. Domain controllers are not included.
domain_join_host_team:
  psychiatricbooth: team1
  typewriter: team1
  pumpkinpatch: team2
  sopwithcamel: team2

# Edit these values if your domain names or domain-controller IPs differ.
# Domain admin passwords are loaded from an existing Ansible Vault file,
# not stored in the role or in Git.
domain_join_teams:
  team1:
    domain: team1.peanuts.local
    dns_server: 192.168.1.1
    admin_user: Administrator@team1.peanuts.local
    admin_password: "{{ vault_team1_domain_admin_password }}"
  team2:
    domain: team2.peanuts.local
    dns_server: 192.168.2.1
    admin_user: Administrator@team2.peanuts.local
    admin_password: "{{ vault_team2_domain_admin_password }}"

- name: Create competition users
  hosts: linux
  become: true

  vars:
    default_password: "GoodGrief123!"
    user_shell: /bin/bash

    admin_users:
      - charliebrown
      - lucyvanpelt
      - linusvanpelt
      - peppermintpatty
      - marcie

    normal_users:
      - snoopy
      - woodstock
      - sallybrown
      - schroeder
      - pigpen

  tasks:
    - name: Create admin users (sudo group)
      ansible.builtin.user:
        name: "{{ item }}"
        shell: "{{ user_shell }}"
        groups: sudo
        append: true
        create_home: true
        password: "{{ default_password | password_hash('sha512', 'peanutsalt') }}"
        update_password: always
        state: present
      loop: "{{ admin_users }}"
      no_log: true

    - name: Create normal users
      ansible.builtin.user:
        name: "{{ item }}"
        shell: "{{ user_shell }}"
        create_home: true
        password: "{{ default_password | password_hash('sha512', 'peanutsalt') }}"
        update_password: always
        state: present
      loop: "{{ normal_users }}"
      no_log: true